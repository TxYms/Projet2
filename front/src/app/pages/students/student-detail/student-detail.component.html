<div class="card m-3">
  <h5 class="card-header">Student details</h5>
  <div class="card-body">
    @if (loading) {
      <div>Loading...</div>
    }

    @if (errorMessage) {
      <div class="alert alert-danger">{{ errorMessage }}</div>
    }

    @if (student) {
      <dl>
        <dt>Id</dt>
        <dd>{{ student.id }}</dd>
        <dt>First name</dt>
        <dd>{{ student.firstName }}</dd>
        <dt>Last name</dt>
        <dd>{{ student.lastName }}</dd>
        <dt>Email</dt>
        <dd>{{ student.email }}</dd>
      </dl>
      <a class="btn btn-warning mr-1" [routerLink]="['/students', student.id, 'edit']">Edit</a>
      <button class="btn btn-danger mr-1" type="button" (click)="onDelete()">Delete</button>
    }
    <a class="btn btn-secondary" routerLink="/students">Back to the list</a>
  </div>
</div>
